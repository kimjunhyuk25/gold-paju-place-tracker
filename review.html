<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>영수증 리뷰 | 한국표준금거래소 파주금촌점</title>
<meta name="robots" content="noindex">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; background: #fbf8f0; color: #1f2a3a; word-break: keep-all; }
  .wrap { max-width: 420px; margin: 0 auto; padding: 48px 24px; text-align: center; }
  .shop { color: #8a6a1f; font-weight: 800; font-size: 16px; }
  h1 { font-size: 26px; line-height: 1.4; margin: 12px 0 8px; }
  p { font-size: 17px; line-height: 1.6; color: #444; margin: 8px 0 24px; }
  a.btn { display: block; padding: 16px; border-radius: 12px; font-size: 18px; font-weight: 800; text-decoration: none; margin: 12px 0; }
  a.app { background: #03c75a; color: #fff; }
  a.web { background: #fff; color: #1f2a3a; border: 2px solid #ddd; }
  .steps { text-align: left; background: #fff; border-radius: 12px; padding: 16px 20px; font-size: 16px; line-height: 1.8; margin-top: 24px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="shop">한국표준금거래소 파주금촌점</div>
  <h1>네이버 영수증 리뷰<br>화면을 여는 중이에요</h1>
  <p>잠시 후 네이버 앱이 열립니다.<br>열리지 않으면 아래 버튼을 눌러주세요.</p>
  <a class="btn app" id="appBtn" href="#">네이버 앱에서 열기</a>
  <a class="btn web" id="webBtn" href="#">앱 없이 웹에서 열기</a>
  <div class="steps">
    1. '영수증 인증'을 누르고 영수증 찍기<br>
    2. 별점과 한 줄 후기 쓰고 등록
  </div>
</div>
<script>
(function () {
  var TARGET = "https://m.place.naver.com/my/checkin";
  var ua = navigator.userAgent || "";
  var isAndroid = /Android/i.test(ua);
  var isIOS = /iPhone|iPad|iPod/i.test(ua);
  var inNaverApp = /NAVER\(inapp/i.test(ua);
  var enc = encodeURIComponent(TARGET);
  var androidIntent = "intent://inappbrowser?url=" + enc + "&target=new&version=6#Intent;scheme=naversearchapp;action=android.intent.action.VIEW;category=android.intent.category.BROWSABLE;package=com.nhn.android.search;S.browser_fallback_url=" + enc + ";end";
  var iosScheme = "naversearchapp://inappbrowser?url=" + enc + "&target=new&version=6";

  document.getElementById("webBtn").href = TARGET;
  document.getElementById("appBtn").href = isAndroid ? androidIntent : (isIOS ? iosScheme : TARGET);

  function openApp() {
    if (inNaverApp || (!isAndroid && !isIOS)) { window.location.replace(TARGET); return; }
    if (isAndroid) { window.location.href = androidIntent; return; }
    var opened = false;
    function onHide() { if (document.visibilityState === "hidden") opened = true; }
    document.addEventListener("visibilitychange", onHide);
    window.setTimeout(function () {
      document.removeEventListener("visibilitychange", onHide);
      if (!opened) window.location.href = TARGET;
    }, 1500);
    window.location.href = iosScheme;
  }
  window.setTimeout(openApp, 300);
})();
</script>
</body>
</html>
